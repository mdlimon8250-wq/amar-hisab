name: Build Amar Hisab APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          mkdir source
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source
          PROJECT_DIR=$(dirname "$(find source -name pubspec.yaml -print -quit)")
          test -f "$PROJECT_DIR/pubspec.yaml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android
        run: |
          cd "$PROJECT_DIR"
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
