name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org com.amarhisab --project-name amar_hisab

      - name: Patch app name, icons, backup flag
        run: dart run tool/patch_android.dart

      - run: flutter pub get

      - name: Analyze (errors fail the build; style hints do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build release APKs (one small APK per CPU type + one universal)
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: amar-hisab-apk
          path: build/app/outputs/flutter-apk/*.apk
